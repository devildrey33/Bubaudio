<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Bubaudio</title>

    <link rel="stylesheet" href="./src/styles.css">

    <link rel="stylesheet" href="./src/ui/controls.css">
    <link rel="stylesheet" href="./src/ui/queue.css">
    <link rel="stylesheet" href="./src/ui/library.css">
    <link rel="stylesheet" href="./src/ui/shaderSelector.css">
    <link rel="stylesheet" href="./src/ui/contextMenu.css">
    <link rel="stylesheet" href="./src/ui/audioDebugPanel.css">
    <link rel="stylesheet" href="./src/ui/nowPlayingTooltip.css">
    <link rel="stylesheet" href="./src/ui/randomListTooltip.css">
    <link rel="stylesheet" href="./src/ui/libraryScanProgressPanel.css">
    <link rel="stylesheet" href="./src/ui/musicPathsSetupPanel.css">
</head>

<body>

    <!-- Zona superior para mostrar el selector de shaders -->
    <div id="shader-trigger">
        <div id="shaderPanel">
            <div class="shader-panel-header">
                <span class="shader-panel-icon" aria-hidden="true">✦</span>
                <span>Visualizador</span>
            </div>
            <div class="shader-selector-row">
                <button id="btn-shader-prev" title="Shader anterior">◀</button>
                <select id="shader-select"></select>
                <button id="btn-shader-next" title="Siguiente shader">▶</button>
            </div>
        </div>
    </div>


    <!-- Tooltip con los datos de la cancion -->
    <div id="now-playing-tooltip" class="visible">

        <div id="now-playing-title"></div>

        <div id="now-playing-artist"></div>

        <div id="now-playing-album"></div>

    </div>

    <div id="random-list-tooltip" aria-live="polite">
        <div class="random-list-tooltip-title">Lista aleatoria generada</div>
        <div id="random-list-tooltip-label"></div>
    </div>

    <div id="library-scan-overlay" hidden>
        <section class="library-scan-panel"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="library-scan-title">
            <div class="library-scan-heading">
                <span class="library-scan-icon" aria-hidden="true">♫</span>
                <div>
                    <h2 id="library-scan-title">Escaneando biblioteca</h2>
                    <p id="library-scan-status">Preparando el escaneo...</p>
                </div>
            </div>
            <div class="library-scan-progress" role="progressbar"
                 aria-label="Progreso del escaneo de música">
                <div></div>
            </div>
            <div class="library-scan-details">
                <span id="library-scan-artist">Grupo: —</span>
                <span id="library-scan-folder">Carpeta: —</span>
            </div>
            <p id="library-scan-counts">0 grupos · 0 discos · 0 canciones</p>
        </section>
    </div>

    <div id="music-path-setup-overlay" hidden>
        <section class="music-path-setup-panel"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="music-path-setup-title">
            <div class="music-path-setup-heading">
                <span class="music-path-setup-icon" aria-hidden="true">♫</span>
                <div>
                    <h2 id="music-path-setup-title">Configura tu biblioteca</h2>
                    <p>Añade uno o más directorios raíz de música para empezar.</p>
                </div>
            </div>
            <div id="music-path-list" class="music-path-list"></div>
            <p id="music-path-setup-status" role="status"></p>
            <div class="music-path-setup-actions">
                <button id="music-path-add" type="button">
                    Seleccionar directorio
                </button>
                <button id="music-path-continue" type="button" disabled>
                    Continuar
                </button>
            </div>
        </section>
    </div>

    <!-- PANEL IZQUIERDO -->

    <div id="library-trigger">

        <div id="library-panel">

            <div class="panel-header">
                Biblioteca
            </div>

            <div id="library-tree">
            </div>

        </div>

    </div>

    <!-- PANEL DERECHO -->

    <div id="queue-trigger">

        <div id="queue-panel">

            <div class="panel-header">
                <span>Cola de reproducción</span>
                <button id="queue-generate-button"
                        type="button"
                        title="Generar una lista aleatoria"
                        aria-label="Generar una lista aleatoria"
                        aria-haspopup="menu">
                    🎲
                </button>
            </div>

            <div id="queue-list">

            </div>

        </div>

    </div>

    <!-- CONTROLES -->
    <div id="controls-trigger">

        <!-- Barra flotante -->
        <div id="player-controls">

            <!-- Progreso -->
            <div id="player-progress-container">

            <span id="current-time">
                00:00
            </span>

            <input
                id="progress-bar"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <span id="total-time">
                00:00
            </span>

        </div>


        <!-- Controles -->
        <div id="player-buttons-container">

            <button id="btn-prev"
                    class="player-button"
                    title="Anterior">
                ⏮
            </button>

            <button id="btn-stop"
                    class="player-button"
                    title="Detener">
                ⏹
            </button>

            <button id="btn-play"
                    class="player-button player-button-primary"
                    title="Reproducir">

                <span class="icon-play">
                    ▶
                </span>

            </button>

            <button id="btn-next"
                    class="player-button"
                    title="Siguiente">
                ⏭
            </button>

            <button id="btn-shuffle"
                    class="player-button"
                    title="Aleatorio">
                🔀
            </button>

            <button id="btn-repeat"
                    class="player-button"
                    title="Opciones de repetición y listas">
                🔁
            </button>
            <button id="btn-select-folder"
                    class="player-button"
                    title="Añadir directorio de música"
                    aria-label="Añadir directorio de música">
                📁
            </button>


            <!-- Volumen -->

            <div id="volume-container">
                <span id="volume-icon">
                    🔊
                </span>

                <input
                    id="volume-bar"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                >
            </div>
        </div>
    </div>



    <script type="module"
            src="/src/main.js">
    </script>

</body>

</html>
